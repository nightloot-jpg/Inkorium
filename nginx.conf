# Inkorium frontend.
# Persistent media is served by Hetzner Object Storage through signed/public URLs.
server {
  listen 80;
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|ttf|woff|woff2)$ {
    try_files $uri =404;
    expires max;
    add_header Cache-Control public;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz { add_header Content-Type text/plain; return 200 'ok'; }
}
