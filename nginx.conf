# Public media host: serve persistent Hetzner media storage directly.
server {
  listen 80;
  listen 3000;
  server_name media.inkorium.es;

  root /data/inkorium-media;
  autoindex off;

  location / {
    try_files $uri =404;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Content-Type, Authorization" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag" always;
    add_header Accept-Ranges bytes always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location = /healthz {
    default_type text/plain;
    return 200 'ok';
  }
}

# Inkorium frontend.
server {
  listen 80;
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|ttf|woff|woff2)$ {
    try_files $uri =404;
    expires max;
    add_header Cache-Control public;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz { add_header Content-Type text/plain; return 200 'ok'; }
}
