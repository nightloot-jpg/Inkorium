<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inkorium</title>
    <meta name="description" content="Inkorium - La red social nostálgica inspirada en Tuenti y Nuenti. Conéctate con tus amigos, fotos, tablón y chat." />
    <meta property="og:title" content="Inkorium" />
    <meta property="og:description" content="Inkorium - La red social nostálgica inspirada en Tuenti y Nuenti. Conéctate con tus amigos, fotos, tablón y chat." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%233869A0'/><circle cx='35' cy='40' r='7' fill='white'/><circle cx='65' cy='40' r='7' fill='white'/><path d='M32 65 Q50 82 68 65' stroke='white' stroke-width='7' stroke-linecap='round' fill='none'/></svg>" />
  </head>
  <body class="bg-[#ebedf0] text-[#333333] antialiased selection:bg-[#3869a0] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const openFullPhoto = (event) => {
          const trigger = event.target.closest('button, a, [role="button"]');
          if (!trigger) return;
          const label = (trigger.textContent || '').replace(/\s+/g, ' ').trim();
          if (label !== 'Ver foto completa') return;

          let container = trigger.parentElement;
          let image = null;
          for (let i = 0; i < 8 && container; i += 1) {
            image = container.querySelector('img[src], img[data-src]');
            if (image) break;
            container = container.parentElement;
          }
          if (!image) return;

          const source = image.currentSrc || image.src || image.getAttribute('data-src');
          if (!source) return;

          event.preventDefault();
          event.stopPropagation();

          const existing = document.getElementById('inkorium-full-photo-viewer');
          if (existing) existing.remove();

          const overlay = document.createElement('div');
          overlay.id = 'inkorium-full-photo-viewer';
          overlay.setAttribute('role', 'dialog');
          overlay.setAttribute('aria-modal', 'true');
          overlay.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(4px);';

          const close = document.createElement('button');
          close.type = 'button';
          close.setAttribute('aria-label', 'Cerrar foto');
          close.textContent = '×';
          close.style.cssText = 'position:absolute;top:14px;right:18px;width:42px;height:42px;border:0;border-radius:9999px;background:rgba(255,255,255,.14);color:#fff;font-size:32px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;';

          const fullImage = document.createElement('img');
          fullImage.src = source;
          fullImage.alt = image.alt || 'Foto completa';
          fullImage.style.cssText = 'display:block;max-width:calc(100vw - 48px);max-height:calc(100vh - 48px);width:auto;height:auto;object-fit:contain;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.45);';
          fullImage.addEventListener('click', (e) => e.stopPropagation());

          let onKeyDown;
          const closeViewer = () => {
            overlay.remove();
            document.removeEventListener('keydown', onKeyDown);
          };
          onKeyDown = (e) => {
            if (e.key === 'Escape') closeViewer();
          };

          close.addEventListener('click', (e) => { e.stopPropagation(); closeViewer(); });
          overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeViewer();
          });
          document.addEventListener('keydown', onKeyDown);

          overlay.appendChild(fullImage);
          overlay.appendChild(close);
          document.body.appendChild(overlay);
        };

        document.addEventListener('click', openFullPhoto, true);
      })();
    </script>
  </body>
</html>
