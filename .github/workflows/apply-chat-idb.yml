name: apply-chat-idb
on:
  push:
    paths:
      - 'src/lib/chatIndexedDb.ts'
      - '.github/workflows/apply-chat-idb.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Integrate IndexedDB
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/context/InkoriumContext.tsx')
          s = p.read_text()
          old = "import { appendMessageToConversation, updateMessageInConversation, normalizeUserId, broadcastCrossTabEvent, subscribeCrossTabEvents, markConversationAsRead, applyReadReceiptsToConversation, getStoredBlockedUserIds, saveStoredBlockedUserIds } from '../lib/chatHistory';"
          new = old + "\nimport { loadChatHistory, persistChatMessages, deletePersistedChatMessages, mergeChatHistory } from '../lib/chatIndexedDb';"
          if old not in s:
              raise SystemExit('chatHistory import not found')
          s = s.replace(old, new, 1)
          old_state = "  const [chatMessages, setChatMessages] = useState<ChatMessage[]>([]);"
          new_state = "  const [chatMessages, setChatMessages] = useState<ChatMessage[]>(() => {\n    // Keep the UI instant from the existing localStorage conversation cache.\n    if (typeof localStorage === 'undefined') return [];\n    try {\n      const keys = [];\n      for (let i = 0; i < localStorage.length; i++) {\n        const key = localStorage.key(i) || '';\n        if (key.startsWith('inkorium:chat_history_store:')) keys.push(key);\n      }\n      const unique = new Map<string, ChatMessage>();\n      for (const key of keys) {\n        try {\n          const parsed = JSON.parse(localStorage.getItem(key) || '[]');\n          if (Array.isArray(parsed)) for (const msg of parsed) if (msg?.id) unique.set(String(msg.id), msg);\n        } catch {}\n      }\n      return Array.from(unique.values()).sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));\n    } catch { return []; }\n  });"
          if old_state not in s:
              raise SystemExit('chatMessages state not found')
          s = s.replace(old_state, new_state, 1)
          marker = "  const [notifications, setNotifications] = useState<InkoriumNotification[]>(() => {"
          load_effect = "  // Hydrate the logged-in user's chat from IndexedDB without blocking the initial render.\n  useEffect(() => {\n    const ownerId = currentUserIdRef.current || currentUserId;\n    if (!ownerId) return;\n    let cancelled = false;\n    void loadChatHistory(ownerId).then(cached => {\n      if (cancelled || cached.length === 0) return;\n      setChatMessages(prev => mergeChatHistory(cached, prev));\n    });\n    return () => { cancelled = true; };\n  }, [currentUserId]);\n\n"
          if marker not in s:
              raise SystemExit('notification marker not found')
          s = s.replace(marker, load_effect + marker, 1)
          sync_marker = "  // Sync messages to localStorage\n  useEffect(() => {\n    safeSetLocalStorage('inkorium:messages', JSON.stringify(messages));\n    safeSetLocalStorage('inkorium:private_messages', JSON.stringify(messages));\n  }, [messages]);"
          chat_persist = "\n\n  // Persist the active user's chat asynchronously in IndexedDB. localStorage remains a fallback.\n  useEffect(() => {\n    const ownerId = currentUserId;\n    if (!ownerId || chatMessages.length === 0) return;\n    const timer = window.setTimeout(() => {\n      void persistChatMessages(ownerId, chatMessages);\n    }, 150);\n    return () => window.clearTimeout(timer);\n  }, [currentUserId, chatMessages]);"
          if sync_marker not in s:
              raise SystemExit('messages sync marker not found')
          s = s.replace(sync_marker, sync_marker + chat_persist, 1)
          # Replace the existing server hydration setter with a merge, preserving cached messages while online data arrives.
          old_fetch = "          setChatMessages(prev => {\n            const existingIds = new Set(prev.map(m => m.id));\n            const newMsgs = data.filter((m: any) => !existingIds.has(m.id));"
          new_fetch = "          setChatMessages(prev => {\n            const incoming = data as ChatMessage[];\n            const merged = mergeChatHistory(prev, incoming);\n            return merged;\n            const existingIds = new Set(prev.map(m => m.id));\n            const newMsgs = data.filter((m: any) => !existingIds.has(m.id));"
          if old_fetch in s:
              # Keep the unreachable legacy body out, because it would be dead code after return and fail lint in some configs.
              start = s.index(old_fetch)
              end = s.index("          });", start) + len("          });")
              # Find the full setChatMessages callback by balancing braces.
              j = start
              depth = 0
              in_str = False
              esc = False
              while j < len(s):
                  ch = s[j]
                  if in_str:
                      if esc: esc = False
                      elif ch == '\\': esc = True
                      elif ch == '"': in_str = False
                  elif ch == '"': in_str = True
                  elif ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                  if depth == 0 and s[j:j+3] == ');\n':
                      end = j + 3
                      break
                  j += 1
              replacement = "          setChatMessages(prev => mergeChatHistory(prev, data as ChatMessage[]));"
              s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
      - name: Add persistence to direct message mutations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/context/InkoriumContext.tsx')
          s=p.read_text()
          # Persist deletion locally in IndexedDB whenever the app already records deleted IDs.
          needle="    addDeletedMessageIds([messageId]);"
          repl=needle+"\n    if (currentUserIdRef.current) void deletePersistedChatMessages(currentUserIdRef.current, [messageId]);"
          s=s.replace(needle,repl)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/InkoriumContext.tsx
          git commit -m 'feat: hydrate and persist chat history with IndexedDB' || true
          git rm .github/workflows/apply-chat-idb.yml
          git commit -m 'chore: remove temporary chat persistence workflow'
          git push origin main
