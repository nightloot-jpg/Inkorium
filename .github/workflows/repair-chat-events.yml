name: Repair chat and events navigation

on:
  push:
    branches:
      - fix/chat-events-navigation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch navigation and chat
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('src/main.tsx')
          text = main.read_text()

          replacements = [
              ("import { PeopleView } from './PeopleView';", "import { PeopleView } from './PeopleView';\nimport { EventsView } from './features/events/EventsView';"),
              ('type Page = \"inicio\" | \"perfil\" | \"mensajes\" | \"personas\" | \"musica\" | \"buscar\" | \"fotos\" | \"videos\";', 'type Page = \"inicio\" | \"perfil\" | \"mensajes\" | \"personas\" | \"musica\" | \"buscar\" | \"fotos\" | \"videos\" | \"eventos\";'),
              ('{([[\"inicio\",\"Inicio\"],[\"perfil\",\"Perfil\"],[\"mensajes\",\"Mensajes\"],[\"personas\",\"Personas\"],[\"musica\",\"Musica\"],[\"fotos\",\"Fotos\"]] as [Page,string][]).map(([id,label])=><button className={page===id?\"active\":\"\"} onClick={()=>navigate(id)} key={id}>{label}</button>)}', '{([[\"inicio\",\"Inicio\"],[\"perfil\",\"Perfil\"],[\"mensajes\",\"Mensajes\"],[\"personas\",\"Personas\"],[\"musica\",\"Musica\"],[\"fotos\",\"Fotos\"],[\"eventos\",\"Eventos\"]] as [Page,string][]).map(([id,label])=><button className={page===id?\"active\":\"\"} onClick={()=>{if(id===\"mensajes\"){window.dispatchEvent(new CustomEvent(\"open-chat-panel\"));return;}navigate(id);}} key={id}>{label}</button>)}'),
              ('[\"□\",\"Eventos\",\"buscar\"]', '[\"□\",\"Eventos\",\"eventos\"]'),
              ('{page===\"fotos\"?<PhotosPage session={session} profileId={currentRoute.params?.userId} navigate={navigate}/>:<div className=\"feed-layout\">', '{page===\"fotos\"?<PhotosPage session={session} profileId={currentRoute.params?.userId} navigate={navigate}/>:page===\"eventos\"?<EventsView session={session} username={username} onExit={()=>navigate(\"inicio\")}/>:<div className=\"feed-layout\">'),
              ('</main></div>}</div>;\n}', '</main></div>}<ChatWidget session={session} navigate={navigate}/></div>;\n}'),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected main.tsx pattern: {old[:100]}')
              text = text.replace(old, new, 1)

          main.write_text(text)

          chat = Path('src/ChatWidget.tsx')
          text = chat.read_text()
          marker = '  useEffect(() => {\n    let cancelled = false;\n    const loadContacts = async () => {'
          insertion = '''  useEffect(() => {\n    const openPanel = () => setPanelOpen(true);\n    globalThis.window.addEventListener("open-chat-panel", openPanel);\n    return () => globalThis.window.removeEventListener("open-chat-panel", openPanel);\n  }, []);\n\n'''
          if marker not in text:
              raise SystemExit('Missing expected ChatWidget contact effect marker')
          text = text.replace(marker, insertion + marker, 1)
          chat.write_text(text)

          css = Path('src/styles.css')
          css_text = css.read_text()
          if '.tuenti-chat-toggle' not in css_text:
              css_text += '''\n\n/* Tuenti-style floating chat widget */\n.tuenti-chat-root{position:fixed;inset:0;z-index:12000;pointer-events:none}\n.tuenti-chat-root button,.tuenti-chat-root input{font:inherit}\n.tuenti-chat-toggle{position:fixed;right:24px;bottom:18px;width:52px;height:52px;border:0;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 8px 24px rgba(30,20,80,.28);cursor:pointer;pointer-events:auto}\n.tuenti-chat-badge{position:absolute;right:-2px;top:-2px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#e53935;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}\n.tuenti-contact-panel{position:fixed;right:24px;bottom:82px;width:320px;max-height:520px;display:flex;flex-direction:column;background:#fff;border:1px solid;border-radius:10px;overflow:hidden;box-shadow:0 14px 40px rgba(20,30,60,.25);pointer-events:auto}\n.tuenti-panel-header{height:46px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-weight:700}\n.tuenti-panel-close,.tuenti-header-btn,.tuenti-minimized-close{border:0;background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer}\n.tuenti-panel-search{margin:10px;border:1px solid;border-radius:7px;height:36px;display:flex;align-items:center;gap:7px;padding:0 9px;color:#718096}\n.tuenti-panel-search input{width:100%;border:0;outline:0;background:transparent;color:#26374c}\n.tuenti-contact-list{overflow:auto;max-height:380px;padding:4px}\n.tuenti-contact-row{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:9px;border-radius:7px;text-align:left;cursor:pointer;color:#26374c}\n.tuenti-contact-row:hover{background:#f1f4f8}\n.tuenti-contact-avatar,.tuenti-header-avatar,.tuenti-minimized-avatar{position:relative;width:36px;height:36px;flex:0 0 36px;border-radius:50%;background:#edf2f7;display:grid;place-items:center;overflow:visible;font-weight:700;color:#2764a8}\n.tuenti-contact-avatar img,.tuenti-header-avatar img,.tuenti-minimized-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}\n.tuenti-status-dot{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border:2px solid #fff;border-radius:50%;background:#9aa6b2}\n.tuenti-status-dot.online{background:#16a765}\n.tuenti-contact-info{min-width:0;flex:1}.tuenti-contact-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tuenti-unread-badge{min-width:18px;height:18px;border-radius:9px;color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}\n.tuenti-panel-add-contact{margin:6px;padding:10px;border:0;border-top:1px solid #e8edf2;background:#fff;color:#2864a6;display:flex;justify-content:center;align-items:center;gap:7px;cursor:pointer}\n.tuenti-chat-window{position:fixed;display:flex;flex-direction:column;background:#fff;border:1px solid #dce3ea;border-radius:9px;overflow:hidden;box-shadow:0 14px 40px rgba(20,30,60,.25);pointer-events:auto;min-width:280px;min-height:280px}\n.tuenti-chat-header{height:44px;flex:0 0 44px;padding:0 9px;display:flex;align-items:center;justify-content:space-between;color:#fff;cursor:grab}\n.tuenti-header-left{display:flex;align-items:center;gap:8px;min-width:0}.tuenti-header-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tuenti-header-right{display:flex;gap:2px}.tuenti-header-btn{width:24px;height:24px;border-radius:4px;color:#fff}.tuenti-header-btn:hover{background:rgba(255,255,255,.16)}\n.tuenti-chat-messages{flex:1;overflow:auto;padding:12px;background:#f7f9fb}.tuenti-loading,.tuenti-empty{text-align:center;color:#8794a2;font-size:13px;padding:30px 10px}.tuenti-message{display:flex;flex-direction:column;margin-bottom:9px;max-width:82%}.tuenti-message.mine{margin-left:auto;align-items:flex-end}.tuenti-message.theirs{align-items:flex-start}.tuenti-bubble{padding:8px 10px;border-radius:12px;background:#e8eef5;color:#26374c;font-size:13px;line-height:1.35}.tuenti-message.mine .tuenti-bubble{background:#e1d7f8;color:#34205f}.tuenti-bubble.pending{opacity:.65}.tuenti-time{font-size:9px;color:#9aa6b2;margin-top:3px}\n.tuenti-chat-input{flex:0 0 auto;background:#fff;border-top:2px solid;padding:6px 8px}.tuenti-input-toolbar{display:flex;gap:2px;margin-bottom:5px}.tuenti-toolbar-btn{border:0;background:transparent;color:#718096;padding:3px;cursor:pointer}.tuenti-input-form{display:flex;gap:6px}.tuenti-input{flex:1;min-width:0;height:34px;border:1px solid;border-radius:7px;padding:0 9px;outline:0}.tuenti-send-btn{width:34px;height:34px;border:0;border-radius:7px;color:#fff;display:grid;place-items:center;cursor:pointer}.tuenti-send-btn:disabled{opacity:.45;cursor:not-allowed}\n.tuenti-chat-window .tuenti-header-avatar{width:30px;height:30px;flex-basis:30px}.tuenti-chat-window .tuenti-header-avatar .tuenti-status-dot{width:9px;height:9px}.tuenti-chat-minimized{position:fixed;height:40px;border-radius:7px 7px 0 0;color:#fff;box-shadow:0 7px 20px rgba(20,30,60,.2);pointer-events:auto;cursor:pointer}.tuenti-minimized-content{height:100%;display:flex;align-items:center;gap:8px;padding:0 8px}.tuenti-minimized-avatar{width:26px;height:26px;flex-basis:26px;color:#2864a6;background:#fff}.tuenti-minimized-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:700}.tuenti-minimized-badge{min-width:17px;height:17px;border-radius:9px;background:#e53935;color:#fff;font-size:9px;display:grid;place-items:center}\n@media (max-width:700px){.tuenti-contact-panel{right:10px;left:10px;bottom:74px;width:auto}.tuenti-chat-toggle{right:14px;bottom:14px}.tuenti-chat-window{left:10px!important;right:10px;width:auto!important;bottom:64px!important;height:calc(100vh - 84px)!important;max-height:none}}\n'''
              css.write_text(css_text)
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx src/ChatWidget.tsx src/styles.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore chat and events navigation"
          git push
