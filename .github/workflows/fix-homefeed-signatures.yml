name: Apply HomeFeed signature filter

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore HomeFeed from pre-change commit and patch filter
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          original_commit = "6e4b73ec66e473a27df24ba109562b77e3151d69"
          path = Path("src/components/HomeFeed.tsx")

          original = subprocess.check_output(
              ["git", "show", f"{original_commit}:{path.as_posix()}"],
              text=True,
          )

          old = '''  // Filter feed items
  const filteredFeed = feed.filter(item => {
    // Las firmas en tablón se gestionan exclusivamente en el perfil y en Avisos (notificaciones), nunca en el feed
    if (item.tipo === 'tablon') {
      return false;
    }

    // If it is a photo feed item or has an associated photoId, check privacy
'''

          new = '''  // Filter feed items
  const filteredFeed = feed.filter(item => {
    // Las firmas en tablón se gestionan exclusivamente en el perfil y en Avisos (notificaciones), nunca en el feed
    if (item.tipo === 'tablon') {
      return false;
    }

    // Excluir explícitamente cualquier publicación o evento relacionado con "firma recibida".
    // Se normaliza el texto para cubrir mayúsculas, acentos y variantes habituales.
    const normalizedFeedText = [
      item.tipo,
      item.datos,
      item.propietarioNombre,
      item.visitanteNombre
    ]
      .filter((value): value is string => typeof value === 'string')
      .join(' ')
      .normalize('NFD')
      .replace(/[\\u0300-\\u036f]/g, '')
      .toLowerCase();

    const isReceivedSignature =
      normalizedFeedText.includes('firma recibida') ||
      normalizedFeedText.includes('firma_recibida') ||
      normalizedFeedText.includes('firmarecibida') ||
      normalizedFeedText.includes('firma recibio') ||
      normalizedFeedText.includes('recibiste una firma');

    if (isReceivedSignature) {
      return false;
    }

    // Las interacciones de amistad no son contenido para el feed principal.
    if (item.tipo === 'amistad') {
      return false;
    }

    // Los eventos relacionados con firmas tampoco son contenido del feed principal.
    if (item.tipo === 'evento' && normalizedFeedText.includes('firma')) {
      return false;
    }

    // If it is a photo feed item or has an associated photoId, check privacy
'''

          if old not in original:
              raise SystemExit("No se encontró el bloque esperado en el HomeFeed original")

          patched = original.replace(old, new, 1)
          path.write_text(patched, encoding="utf-8")

      - name: Commit patched HomeFeed and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-homefeed-signatures.yml
          git add src/components/HomeFeed.tsx .github/workflows/fix-homefeed-signatures.yml
          git commit -m "fix: filter firma recibida from home feed"
          git push