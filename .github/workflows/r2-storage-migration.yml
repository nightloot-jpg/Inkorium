name: Migrate Supabase Storage to Cloudflare R2

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIGRATE to start copying Storage objects to R2'
        required: true
        type: string

jobs:
  migrate:
    if: ${{ inputs.confirm == 'MIGRATE' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun add @aws-sdk/client-s3 @supabase/supabase-js
      - run: bun run scripts/migrate-supabase-storage-to-r2.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: r2-migration-manifest
          path: r2-migration-manifest.json
