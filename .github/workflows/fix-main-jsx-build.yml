name: Repair main JSX build

on:
  push:
    branches:
      - fix/main-jsx-build
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair malformed JSX fragment
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/main.tsx")
          text = path.read_text(encoding="utf-8")

          opening = text.rfind("<>")
          if opening < 0:
              raise SystemExit("Could not find the JSX fragment opening")
          text = text[:opening] + "<div>" + text[opening + 2:]

          needle = "</article>)}</main></div>}</div>;"
          replacement = "</article>)</div>}</main></div>}</div>;"
          if needle not in text:
              raise SystemExit("Could not find the expected final JSX structure in src/main.tsx")
          text = text.replace(needle, replacement, 1)

          path.write_text(text, encoding="utf-8")
          print(f"Replaced fragment opening at character {opening} and closed it before the conditional brace.")

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit verified repair and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx
          git rm .github/workflows/fix-main-jsx-build.yml
          git commit -m "fix: repair malformed JSX in main"
          git push origin HEAD:fix/main-jsx-build
