name: fix-chat-idb-scope
on:
  push:
    paths:
      - '.github/workflows/fix-chat-idb-scope.yml'
      - 'src/context/InkoriumContext.tsx'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix chat hydration scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/context/InkoriumContext.tsx')
          s=p.read_text()
          start=s.index("  const [chatMessages, setChatMessages] = useState<ChatMessage[]>(() => {")
          marker="\n  // Hydrate the logged-in user's chat from IndexedDB without blocking the initial render."
          end=s.index(marker,start)
          s=s[:start]+"  const [chatMessages, setChatMessages] = useState<ChatMessage[]>([]);"+s[end:]
          s=s.replace("    const ownerId = currentUserIdRef.current || currentUserId;", "    const ownerId = currentUserId;")
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/InkoriumContext.tsx
          git commit -m 'fix: scope chat IndexedDB hydration to active user' || true
          git rm .github/workflows/fix-chat-idb-scope.yml
          git commit -m 'chore: remove temporary chat scope workflow'
          git push origin main
