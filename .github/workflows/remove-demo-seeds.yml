name: remove-demo-seeds
on:
  push:
    paths:
      - '.github/workflows/remove-demo-seeds.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove seeded demo content
        shell: python
        run: |
          from pathlib import Path
          import re

          events_file = Path('src/data/mockEventsAndPages.ts')
          s = events_file.read_text()
          patterns = [
              (r"export const INITIAL_EVENTS: SocialEvent\[\] = \[.*?\];\n\nexport const INITIAL_PAGES",
               "export const INITIAL_EVENTS: SocialEvent[] = [];\n\nexport const INITIAL_PAGES"),
              (r"export const INITIAL_PAGES: TuentiPage\[\] = \[.*?\];\n\nexport const TRIVIA_QUESTIONS",
               "export const INITIAL_PAGES: TuentiPage[] = [];\n\nexport const TRIVIA_QUESTIONS"),
              (r"export const INITIAL_GAME_SCORES: GameScore\[\] = \[.*?\];\n\nexport const TRIVIA_QUESTIONS",
               "export const INITIAL_GAME_SCORES: GameScore[] = [];\n\nexport const TRIVIA_QUESTIONS")
          ]
          for pattern, replacement in patterns:
              s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
              if count != 1:
                  # Game scores may be declared after trivia in older revisions. Try the declaration-to-EOF form only for that block.
                  if 'INITIAL_GAME_SCORES' in pattern:
                      s2, count = re.subn(r"export const INITIAL_GAME_SCORES: GameScore\[\] = \[.*?\];", "export const INITIAL_GAME_SCORES: GameScore[] = [];", s, count=1, flags=re.S)
                  if count != 1:
                      raise SystemExit(f'Could not replace seed block: {pattern}')
              s = s2
          events_file.write_text(s)

          events_view = Path('src/components/EventsView.tsx')
          e = events_view.read_text()
          e, n1 = re.subn(r"const PRESET_COVERS = \[.*?\];\n\nconst PARTY_PHOTO_SAMPLES", "const PRESET_COVERS: Array<{ label: string; url: string }> = [];\n\nconst PARTY_PHOTO_SAMPLES", e, count=1, flags=re.S)
          if n1 != 1:
              raise SystemExit('PRESET_COVERS block not found')
          e, n2 = re.subn(r"const PARTY_PHOTO_SAMPLES = \[.*?\];", "const PARTY_PHOTO_SAMPLES: Array<{ label: string; url: string }> = [];", e, count=1, flags=re.S)
          if n2 != 1:
              raise SystemExit('PARTY_PHOTO_SAMPLES block not found')
          e = e.replace("useState(PRESET_COVERS[0].url)", "useState('')")
          events_view.write_text(e)

          ctx = Path('src/context/InkoriumContext.tsx')
          c = ctx.read_text()
          c = c.replace("avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=400&auto=format&fit=crop&q=80',", "avatar: '',")
          ctx.write_text(c)

      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/mockEventsAndPages.ts src/components/EventsView.tsx src/context/InkoriumContext.tsx
          git commit -m 'fix: remove remaining demo seeds from app' || true
          git rm .github/workflows/remove-demo-seeds.yml
          git commit -m 'chore: remove temporary demo cleanup workflow'
          git push origin main
