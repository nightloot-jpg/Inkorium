name: Resolve PR 228 conflict

on:
  push:
    branches:
      - chore/resolve-pr228-conflict

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve PR 228 against main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main fix/profile-identity-after-visit
          git checkout -B fix/profile-identity-after-visit origin/fix/profile-identity-after-visit

          set +e
          git merge origin/main --no-commit --no-ff
          MERGE_STATUS=$?
          set -e

          python <<'PY'
          from pathlib import Path
          import re

          path = Path('src/main.tsx')
          text = path.read_text()

          # If Git left conflict markers, prefer the current main version for
          # conflicting hunks, then re-apply the small profile identity fix.
          if '<<<<<<<' in text:
              lines = text.splitlines(keepends=True)
              out = []
              state = 'normal'
              for line in lines:
                  if line.startswith('<<<<<<<'):
                      state = 'ours'
                      continue
                  if line.startswith('=======') and state == 'ours':
                      state = 'theirs'
                      continue
                  if line.startswith('>>>>>>>') and state == 'theirs':
                      state = 'normal'
                      continue
                  if state in ('normal', 'theirs'):
                      out.append(line)
              text = ''.join(out)

          # The PR's intended fix: never put a visited user's profile into the
          # global authenticated profile store.
          old = 'const profile = useAuthStore(state => state.profile);'
          new = '''const authProfile = useAuthStore(state => state.profile);\n  const setProfile = useAuthStore(state => state.setProfile);\n  const [viewedProfile, setViewedProfile] = useState<ProfileData | null>(null);\n  const profile = isOwnProfile ? authProfile : viewedProfile;'''

          # Handle both the original compact declaration and a formatted variant.
          if old in text and 'const authProfile = useAuthStore(state => state.profile);' not in text:
              text = text.replace(old, new, 1)
          elif 'const authProfile = useAuthStore(state => state.profile);' not in text:
              pattern = r'const profile = useAuthStore\(state => state\.profile\);\s*const setProfile = useAuthStore\(state => state\.setProfile\);'
              text, count = re.subn(pattern, new, text, count=1)
              if count == 0:
                  raise SystemExit('Could not locate ProfileViewLegacy auth profile declaration')

          old_set = 'setProfile(profileData as ProfileData | null);'
          new_set = '''setViewedProfile(profileData as ProfileData | null);\n    if (isOwnProfile) setProfile(profileData as ProfileData | null);'''
          if 'setViewedProfile(profileData as ProfileData | null);' not in text:
              if old_set not in text:
                  raise SystemExit('Could not locate ProfileViewLegacy profile assignment')
              text = text.replace(old_set, new_set, 1)

          # The composer must always publish as the authenticated user.
          start = text.find('function ProfileViewLegacy')
          if start == -1:
              raise SystemExit('Could not locate ProfileViewLegacy')
          next_fn = text.find('\nfunction ', start + 1)
          end = next_fn if next_fn != -1 else len(text)
          section = text[start:end]
          section = section.replace('profile={profile}', 'profile={authProfile}')
          text = text[:start] + section + text[end:]

          path.write_text(text)
          PY

          # Remove any unresolved merge state and commit the resolved result.
          git add src/main.tsx
          if git diff --cached --quiet; then
            git commit -m "fix: resolve profile identity PR conflict" || true
          else
            git commit -m "fix: resolve profile identity PR conflict"
          fi
          git push origin HEAD:fix/profile-identity-after-visit
