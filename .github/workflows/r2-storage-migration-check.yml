name: Validate R2 migration

on:
  pull_request:
    paths:
      - 'scripts/migrate-supabase-storage-to-r2.mjs'
      - '.github/workflows/r2-storage-migration-check.yml'
      - 'src/lib/r2.ts'
      - 'supabase/functions/r2-media/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-save @aws-sdk/client-s3 @supabase/supabase-js
      - run: node --check scripts/migrate-supabase-storage-to-r2.mjs
