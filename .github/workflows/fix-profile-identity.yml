name: Apply profile identity fix

on:
  push:
    branches:
      - fix/profile-identity-after-visit

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch profile state handling
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/main.tsx')
          text = path.read_text()

          old = '''  const profile = useAuthStore(state => state.profile);\n  const setProfile = useAuthStore(state => state.setProfile); const [posts, setPosts] = useState<Post[]>([]);'''
          new = '''  const authProfile = useAuthStore(state => state.profile);\n  const setProfile = useAuthStore(state => state.setProfile);\n  const [viewedProfile, setViewedProfile] = useState<ProfileData | null>(null);\n  const profile = isOwnProfile ? authProfile : viewedProfile;\n  const [posts, setPosts] = useState<Post[]>([]);'''
          if old not in text:
              raise SystemExit('Expected profile state declaration was not found')
          text = text.replace(old, new, 1)

          old = '''    setProfile(profileData as ProfileData | null);\n\n    const rows = postData ?? [];'''
          new = '''    setViewedProfile(profileData as ProfileData | null);\n    if (isOwnProfile) setProfile(profileData as ProfileData | null);\n\n    const rows = postData ?? [];'''
          if old not in text:
              raise SystemExit('Expected profile loading assignment was not found')
          text = text.replace(old, new, 1)

          old = '''        <Composer session={session} profile={profile} onPublish={(newPost) => setPosts(curr => [newPost, ...curr])} targetProfileId={session.user.id} />'''
          new = '''        <Composer session={session} profile={authProfile || profile} onPublish={(newPost) => setPosts(curr => [newPost, ...curr])} targetProfileId={session.user.id} />'''
          if old not in text:
              raise SystemExit('Own-profile Composer call was not found')
          text = text.replace(old, new, 1)

          old = '''        <Composer session={session} profile={profile} onPublish={(newPost) => setPosts(curr => [newPost, ...curr])} targetProfileId={targetUserId!} targetName={name} />'''
          new = '''        <Composer session={session} profile={authProfile} onPublish={(newPost) => setPosts(curr => [newPost, ...curr])} targetProfileId={targetUserId!} targetName={name} />'''
          if old not in text:
              raise SystemExit('Visited-profile Composer call was not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify build
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx
          git rm .github/workflows/fix-profile-identity.yml
          git commit -m "fix(profile): preserve logged-in identity when visiting profiles"
          git push origin HEAD:fix/profile-identity-after-visit
